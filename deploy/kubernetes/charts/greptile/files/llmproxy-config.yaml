model_list:
    - model_name: claude-*
      litellm_params:
        model: anthropic/claude-*
        api_base: "os.environ/ANTHROPIC_BASE_URL"
        api_key: "os.environ/ANTHROPIC_API_KEY"
    - model_name: gpt-*
      litellm_params:
        model: openai/gpt-*
        api_base: "os.environ/OPENAI_BASE_URL"
        api_key: "os.environ/OPENAI_API_KEY"
    - model_name: text-embedding-*
      litellm_params:
        model: openai/text-embedding-*
        api_base: "os.environ/OPENAI_BASE_URL"
        api_key: "os.environ/OPENAI_API_KEY"
    - model_name: memory-learning
      litellm_params:
        model: anthropic/claude-sonnet-4-6 # could also be gpt-5.6-terra
        api_base: "os.environ/ANTHROPIC_BASE_URL"
        api_key: "os.environ/ANTHROPIC_API_KEY"
        timeout: 300
    #  Example of bedrock
    # - model_name: bedrock/*
    #   litellm_params:
    #     model: bedrock/*
    #     aws_access_key_id: "os.environ/AWS_ACCESS_KEY_ID"
    #     aws_secret_access_key: "os.environ/AWS_SECRET_ACCESS_KEY"
    #     aws_region_name: "os.environ/AWS_REGION_NAME"
    # Example of Azure OpenAI models
    # - model_name: summarizer-pool
    #   litellm_params:
    #     model: azure/gpt-*
    #     api_base: "os.environ/AZURE_OPENAI_BASE_URL"
    #     api_key: "os.environ/AZURE_OPENAI_API_KEY"
    #     api_version: "os.environ/AZURE_OPENAI_API_VERSION"
    #   model_info:
    #     base_model: gpt-*

litellm_settings:
  drop_params: True
  num_retries: 3 # retry call 3 times on each model_name
  allowed_fails: 3
  stream_timeout: 600 # 10 min timeout for streaming responses

batch_settings:
  providers:
    anthropic:
      model_patterns:
        - claude-*
    openai:
      model_patterns:
        - gpt-4o*
        - gpt-5*
        - chatgpt-*

router_settings:
  routing_strategy: simple-shuffle # Literal["simple-shuffle", "least-busy", "usage-based-routing","latency-based-routing"]
  model_group_alias:
    "api-chat-completion": "gpt-5.4-nano"
    "addressed-judge": "gpt-5.4-nano" # could also be gpt-5.6-luna
    "acknowledged-judge": "gpt-5.4-mini" # could also be gpt-5.6-luna
    "comment-analytics": "gpt-5.4-nano" # could also be gpt-5.6-luna
    "comment-classifier": "gpt-5.4-nano"
    "post-review-gate": "gpt-5.4-nano"
    "rule-optimization": "gpt-5.4-nano"
    "memory-embeddings": "text-embedding-3-small"
    "weekly-digest": "claude-haiku-4-5-20251001"
    "first-week-stats": "claude-haiku-4-5-20251001"
    "memory-clustering": "claude-sonnet-4-6"
    "review": "claude-sonnet-4-6"
    "review-deep": "claude-opus-4-6"
    "review-light": "claude-haiku-4-5-20251001"
    "refiner": "claude-sonnet-4-6"
    "reply-agent": "claude-sonnet-4-6" # could also be gpt-5.6-luna

  num_retries: 2
  timeout: 120 # seconds

general_settings:
  forward_client_headers_to_llm_api: true
