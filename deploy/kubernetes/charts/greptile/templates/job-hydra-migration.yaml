{{- if .Values.authV2.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "greptile.fullname" . }}-hydra-migration
  labels:
    {{- include "greptile.labels" . | nindent 4 }}
    app.kubernetes.io/component: hydra-migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "greptile.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hydra-migration
    spec:
      restartPolicy: Never
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: docker.io/bitnamilegacy/postgresql:17.6.0-debian-12-r4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -q -d "$DSN"; do
                echo "waiting for postgres at DSN"
                sleep 2
              done
          env:
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "greptile.secretName" . }}
                  key: DIRECT_URL
      containers:
        - name: hydra-migration
          image: {{ include "greptile.image" (dict "root" . "repository" .Values.authV2.hydra.image.repository "tag" .Values.authV2.hydra.image.tag) }}
          imagePullPolicy: {{ default .Values.global.pullPolicy .Values.authV2.hydra.image.pullPolicy }}
          command: ["hydra", "migrate", "sql", "-e", "--yes"]
          env:
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "greptile.secretName" . }}
                  key: DIRECT_URL
          resources:
            {{- toYaml .Values.authV2.hydra.resources | nindent 12 }}
{{- end }}
