{{- if .Values.migrations.db.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # A Job's pod template is immutable, so each revision gets a new Job.
  name: {{ include "greptile.fullname" . }}-db-migration-{{ .Release.Revision }}
  labels:
    {{- include "greptile.labels" . | nindent 4 }}
  annotations:
    # Helm would delete the previous revision's Job on upgrade, even mid-migration;
    # ttlSecondsAfterFinished cleans it up instead.
    "helm.sh/resource-policy": keep
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "greptile.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-migration
    spec:
      restartPolicy: Never
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: docker.io/bitnamilegacy/postgresql:17.6.0-debian-12-r4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -q -d "$DIRECT_URL"; do
                echo "waiting for postgres at DIRECT_URL"
                sleep 2
              done
          envFrom:
            - configMapRef:
                name: {{ include "greptile.fullname" . }}-env
            - secretRef:
                name: {{ include "greptile.secretName" . }}
      containers:
        - name: db-migration
          image: {{ include "greptile.image" (dict "root" . "repository" .Values.migrations.db.image.repository "tag" .Values.migrations.db.image.tag) }}
          imagePullPolicy: {{ .Values.migrations.db.image.pullPolicy }}
          # Queue behind any running migration Job. Poll with try-lock: a session
          # blocked on a lock holds a snapshot that CREATE INDEX CONCURRENTLY waits
          # on, which deadlocks. The lock lives as long as the psql coprocess.
          command:
            - /bin/bash
            - -ec
            - |
              coproc LOCK { psql "$DIRECT_URL" -qAt; }
              while true; do
                echo "select pg_try_advisory_lock(hashtext('greptile-db-migration'));" >&"${LOCK[1]}"
                read -r locked <&"${LOCK[0]}"
                [ "$locked" = t ] && break
                echo "waiting for another db migration to finish"
                sleep 2
              done
              /entrypoint.sh
              # Not last on purpose: bash execs a -c script's last command, which
              # closes the coprocess and drops the lock mid-migration.
              echo "select pg_advisory_unlock(hashtext('greptile-db-migration'));" >&"${LOCK[1]}"
          envFrom:
            - configMapRef:
                name: {{ include "greptile.fullname" . }}-env
            - secretRef:
                name: {{ include "greptile.secretName" . }}
          env:
            # Migrations should use direct Postgres, not PgBouncer.
            - name: DATABASE_URL
              value: {{ include "greptile.databaseUrl" . | quote }}
            - name: DIRECT_URL
              value: {{ include "greptile.databaseUrl" . | quote }}
            - name: DATABASE_CONNECTION_LIMIT
              value: "5"
          resources:
            {{- toYaml .Values.migrations.db.resources | nindent 12 }}
{{- end }}
