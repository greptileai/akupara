{{- if .Values.o11y.enabled }}
{{- if eq .Values.secrets.mode "native" }}{{- $_ := required "secrets.native.GF_SECURITY_ADMIN_PASSWORD is required when o11y.enabled (scripts/init-values.sh generates it)" .Values.secrets.native.GF_SECURITY_ADMIN_PASSWORD }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "greptile.lgtmName" . }}
  labels:
    {{- include "greptile.labels" . | nindent 4 }}
    app.kubernetes.io/component: lgtm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "greptile.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: lgtm
  template:
    metadata:
      labels:
        {{- include "greptile.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: lgtm
      {{- with .Values.global.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "greptile.serviceAccountName" . }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lgtm
          image: "{{ .Values.o11y.image.repository }}:{{ .Values.o11y.image.tag }}"
          imagePullPolicy: {{ .Values.global.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.global.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: grafana
              containerPort: 3000
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "greptile.secretName" . }}
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            {{- with .Values.network.grafanaUrl }}
            - name: GF_SERVER_ROOT_URL
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.o11y.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.o11y.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "greptile.lgtmName" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "greptile.lgtmName" . }}
  labels:
    {{- include "greptile.labels" . | nindent 4 }}
    app.kubernetes.io/component: lgtm
spec:
  type: ClusterIP
  selector:
    {{- include "greptile.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
{{- end }}
