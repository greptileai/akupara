{{- if eq .Values.secrets.mode "external" }}
{{- /* Keys pulled by secretKeyRef leave a pod in CreateContainerConfigError when the store omits them; CSRF_SECRET crashes auth-v2 at startup. */}}
{{- $required := list }}
{{- if .Values.pgbouncer.enabled }}{{- $required = append $required "DB_PASSWORD" }}{{- end }}
{{- if .Values.authV2.enabled }}{{- $required = concat $required (list "DIRECT_URL" "CSRF_SECRET" "HYDRA_SYSTEM_SECRET" "HYDRA_WEB_CLIENT_SECRET" "HYDRA_TOKEN_HOOK_SECRET") }}{{- end }}
{{- range $component := .Values.components }}{{- if $component.enabled }}{{- $required = concat $required ($component.secretEnv | default list) }}{{- end }}{{- end }}
{{- $provided := list }}
{{- range .Values.secrets.external.data }}{{- $provided = append $provided .secretKey }}{{- end }}
{{- $missing := list }}
{{- range $required | uniq }}{{- if not (has . $provided) }}{{- $missing = append $missing . }}{{- end }}{{- end }}
{{- if $missing }}
{{- fail (printf "secrets.external.data must map these keys, which workloads require at startup (docs/secrets.md): %s" (join ", " $missing)) }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "greptile.secretName" . }}
  labels:
    {{- include "greptile.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.external.secretStoreRef.name }}
    kind: {{ .Values.secrets.external.secretStoreRef.kind }}
  target:
    name: {{ include "greptile.secretName" . }}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.secrets.external.data | nindent 4 }}
{{- end }}
